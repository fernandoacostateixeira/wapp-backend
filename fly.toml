# fly.toml app configuration file generated for wapp-backend on 2026-07-28T20:52:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "wapp-backend"
primary_region = "gru"

[build]

[env]
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
